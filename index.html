<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI Generator</title>
    <style>
        :root { --primary: #00f2ff; --bg: #000; --accent: #7000ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        
        /* HEADER */
        header { position: fixed; top: 0; width: 100%; padding: 15px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #333; z-index: 1000; font-family: sans-serif; letter-spacing: 2px; }

        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; position: absolute; }
        .active { display: flex; }

        /* BOTONES */
        .btn { display: block; width: 100%; max-width: 280px; padding: 20px; margin: 10px 0; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #444; }

        /* ESCANEO */
        .preview-box { width: 260px; height: 260px; border: 1px solid #333; position: relative; overflow: hidden; background: #050505; margin-bottom: 20px; }
        #user-photo { width: 100%; height: 100%; object-fit: cover; display: none; }
        .laser { position: absolute; width: 100%; height: 2px; background: var(--primary); top: 0; display: none; animation: scan 2s infinite linear; box-shadow: 0 0 10px var(--primary); z-index: 10; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        /* RESULTADO (AVATAR) */
        .avatar-container { width: 100%; max-width: 350px; border: 1px solid var(--primary); border-radius: 10px; overflow: hidden; display: none; background: #000; }
        video { width: 100%; display: block; }

        .terminal-text { font-size: 0.8rem; color: var(--primary); text-align: left; width: 260px; height: 50px; margin-top: 10px; overflow: hidden; }
        .back-btn { position: fixed; bottom: 20px; color: #444; background: none; border: none; cursor: pointer; text-decoration: underline; font-family: sans-serif; }
    </style>
</head>
<body>

    <header><b style="color:var(--primary)">SICNOVA</b> | SANTO REINO</header>

    <!-- PANTALLA 1: INICIO -->
    <div id="screen-start" class="screen active">
        <h1 style="font-family: sans-serif; font-weight: 200;">NEURAL <b style="color:var(--primary)">AVATAR</b></h1>
        <button class="btn btn-primary" onclick="showScreen('screen-capture')">Adulto (Selfie)</button>
        <button class="btn btn-outline" onclick="playMinor()">Menor de Edad</button>
    </div>

    <!-- PANTALLA 2: CAPTURA Y ESCANEO -->
    <div id="screen-capture" class="screen">
        <div class="preview-box">
            <div id="laser" class="laser"></div>
            <img id="user-photo" src="">
            <div id="cam-msg" style="margin-top: 100px; color: #222;">MODO CAPTURA</div>
        </div>
        
        <input type="file" id="file-input" accept="image/*" capture="user" style="display:none" onchange="startAI(this)">
        <button id="btn-snap" class="btn btn-primary" onclick="document.getElementById('file-input').click()">Hacer Foto</button>
        
        <div class="terminal-text" id="terminal"></div>
        <button class="back-btn" onclick="location.reload()">Cancelar</button>
    </div>

    <!-- PANTALLA 3: RESULTADO (EL AVATAR) -->
    <div id="screen-result" class="screen">
        <h2 style="font-family: sans-serif; color:var(--primary);">Avatar Generado</h2>
        <div class="avatar-container" id="avatar-box">
            <!-- VÍDEO DE ALTA COMPATIBILIDAD (No se queda en negro) -->
            <video id="avatar-vid" playsinline webkit-playsinline loop muted>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
        </div>
        <div id="phrase" style="margin: 20px 0; color:var(--primary); font-size: 0.9rem;">SINCRO LABIAL OK.</div>
        <button class="btn btn-primary" id="btn-play" onclick="activateAvatar()">Activar Sonido y Voz</button>
        <button class="back-btn" onclick="location.reload()">Nuevo Escaneo</button>
    </div>

    <!-- PANTALLA 4: MENORES -->
    <div id="screen-minor" class="screen">
        <video id="minor-vid" controls playsinline style="width:90%; border-radius:10px;">
            <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
        </video>
        <button class="back-btn" onclick="location.reload()">Volver</button>
    </div>

    <script>
        const terminalLines = [
            "> Conectando con Sicnova Cloud...",
            "> Analizando geometría facial...",
            "> Mapeando texturas dérmicas...",
            "> Generando red neuronal 3D...",
            "> Sincronizando frames de vídeo...",
            "> Digitalización completada."
        ];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function playMinor() {
            showScreen('screen-minor');
            document.getElementById('minor-vid').play();
        }

        function startAI(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('cam-msg').style.display = 'none';
                    const img = document.getElementById('user-photo');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    
                    document.getElementById('laser').style.display = 'block';
                    document.getElementById('btn-snap').style.display = 'none';
                    
                    // Efecto de Terminal Grok
                    let line = 0;
                    const term = document.getElementById('terminal');
                    const interval = setInterval(() => {
                        const p = document.createElement('div');
                        p.innerText = terminalLines[line];
                        term.appendChild(p);
                        line++;
                        if (line >= terminalLines.length) {
                            clearInterval(interval);
                            setTimeout(() => showScreen('screen-result'), 1000);
                        }
                    }, 800);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function activateAvatar() {
            const vid = document.getElementById('avatar-vid');
            document.getElementById('avatar-box').style.display = 'block';
            document.getElementById('btn-play').innerText = "Voz Activada";
            vid.muted = false; // Activa el sonido
            vid.play();
        }
    </script>
</body>
</html>
