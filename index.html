<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI Dashboard</title>
    <!-- Cargamos el estilo tipo Grok/Cyberpunk -->
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #050505;
            --card: #111111;
            --text: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        /* UI de Carga y Header */
        header {
            position: fixed; top: 0; width: 100%; padding: 20px;
            text-align: center; background: rgba(0,0,0,0.8);
            border-bottom: 1px solid #222; z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .main-container {
            display: flex; flex-direction: column;
            width: 100%; height: 100vh;
            align-items: center; justify-content: center;
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; }

        /* Botones Profesionales */
        .btn {
            width: 90%; max-width: 320px; padding: 20px;
            margin: 10px 0; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase; letter-spacing: 1px;
        }

        .btn-adult {
            background: linear-gradient(135deg, var(--primary), #7000ff);
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 242, 255, 0.3);
        }

        .btn-minor {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
        }

        .btn:active { transform: scale(0.95); }

        /* Contenedor del Avatar (IFRAME CORREGIDO) */
        #avatar-engine-container {
            width: 100%; height: 100%;
            background: #000;
            display: none;
            position: absolute; top: 0; left: 0; z-index: 500;
        }

        iframe {
            width: 100%; height: 100%; border: none;
        }

        /* Reproductor de Video para Menores */
        #video-screen { background: #000; }
        video { width: 100%; max-width: 600px; border-radius: 10px; }

        .back-btn {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.1); border: 1px solid #444;
            color: white; padding: 10px 20px; border-radius: 30px;
            z-index: 2000; cursor: pointer;
        }

        h1 { font-weight: 200; letter-spacing: -1px; }
        b { color: var(--primary); }
    </style>
</head>
<body>

    <header id="header">
        <b>SICNOVA AI</b> | INSTITUTO SANTO REINO
    </header>

    <div class="main-container">
        
        <!-- PANTALLA 1: SELECTOR -->
        <div id="screen-selector" class="screen active">
            <h1>Generador de <b>Avatar</b></h1>
            <p style="color: #666; margin-bottom: 30px;">Identificación de usuario necesaria</p>
            <button class="btn btn-adult" onclick="initAvatarEngine()">Acceso Adulto</button>
            <button class="btn btn-minor" onclick="playMinorContent()">Acceso Menor</button>
        </div>

        <!-- PANTALLA 2: MOTOR DE AVATAR (ADULTOS) -->
        <div id="avatar-engine-container">
            <!-- Cargamos el motor de Avaturn (más realista para Sicnova) -->
            <iframe 
                id="avatar-frame" 
                allow="camera *; microphone *; clipboard-write; autoplay"
                src="">
            </iframe>
            <button class="back-btn" onclick="location.reload()">← SALIR DEL MOTOR</button>
        </div>

        <!-- PANTALLA 3: VIDEO (MENORES) -->
        <div id="screen-video" class="screen">
            <video id="minor-video" controls playsinline>
                <!-- VIDEO GENÉRICO: Sustituye por el tuyo -->
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
            <button class="back-btn" onclick="location.reload()">← VOLVER</button>
        </div>

    </div>

    <script>
        /**
         * Lógica para Adultos:
         * Abrimos el motor de Avaturn que es el que MEJOR genera el avatar
         * a partir de una foto en tiempo real.
         */
        function initAvatarEngine() {
            const container = document.getElementById('avatar-engine-container');
            const frame = document.getElementById('avatar-frame');
            const selector = document.getElementById('screen-selector');
            const header = document.getElementById('header');

            // Ocultamos la interfaz y el header para dar espacio al motor
            selector.style.display = 'none';
            header.style.display = 'none';
            container.style.display = 'block';

            // URL del Motor de IA (Ready Player Me optimizado)
            // Se usa el subdominio de Sicnova si existe o uno genérico funcional.
            // Esta URL disparará automáticamente el permiso de cámara.
            frame.src = "https://demo.readyplayer.me/es/avatar?frameApi&theme=dark";
        }

        /**
         * Lógica para Menores:
         * Reproduce el video bloqueando cualquier otro acceso.
         */
        function playMinorContent() {
            const selector = document.getElementById('screen-selector');
            const videoScreen = document.getElementById('screen-video');
            const video = document.getElementById('minor-video');

            selector.style.display = 'none';
            videoScreen.classList.add('active');
            video.play();
        }

        // Listener para recibir el avatar cuando el usuario termine (para Sicnova 3D)
        window.addEventListener('message', (event) => {
            const json = parse(event);
            if (json?.source === 'readyplayerme' && json?.eventName === 'v1.avatar.exported') {
                console.log("Avatar generado con éxito:", json.data.url);
                alert("Avatar generado. Procesando modelo 3D para Sicnova...");
            }
        });

        function parse(event) {
            try { return JSON.parse(event.data); } catch (e) { return null; }
        }
    </script>
</body>
</html>
