<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Santo Reino</title>
    <style>
        :root { --primary: #00f2ff; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; padding: 20px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; z-index: 1000; backdrop-filter: blur(10px); }

        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        /* Estilo Botones Grok */
        .btn { display: block; width: 100%; max-width: 300px; padding: 22px; margin: 15px 0; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-adult { background: linear-gradient(90deg, var(--primary), #7000ff); color: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        .btn-minor { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        /* Contenedor del Motor 3D */
        #avatar-engine-container { display: none; width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 500; background: #000; }
        iframe { width: 100%; height: 100%; border: none; padding-top: 60px; box-sizing: border-box; }

        /* Video Menores */
        video { width: 100%; max-width: 500px; border-radius: 20px; border: 1px solid #333; }
        
        .back-btn { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #444; padding: 10px 25px; border-radius: 50px; cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

    <header><b>SICNOVA AI</b> | IES SANTO REINO</header>

    <!-- 1. SELECTOR INICIAL -->
    <div id="screen-start" class="screen active">
        <h1 style="font-weight: 200; font-size: 2.2rem;">Generador de <br><b style="color:var(--primary)">Avatar 3D</b></h1>
        <p style="color:#666; margin-bottom: 30px;">Iniciando motor de reconstrucción facial...</p>
        <button class="btn btn-adult" onclick="startAdultAI()">Soy Adulto (Crear mi Avatar)</button>
        <button class="btn btn-minor" onclick="startMinorFlow()">Soy Menor de Edad</button>
    </div>

    <!-- 2. MOTOR DE IA (Donde ocurre la magia del selfie) -->
    <div id="avatar-engine-container">
        <!-- Motor oficial de Ready Player Me para Sicnova -->
        <iframe 
            id="rpm-iframe" 
            allow="camera *; microphone *; clipboard-write; autoplay" 
            src="">
        </iframe>
        <button class="back-btn" onclick="location.reload()">← VOLVER AL INICIO</button>
    </div>

    <!-- 3. FLUJO MENORES -->
    <div id="screen-minor" class="screen">
        <video id="minor-video" controls playsinline>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-btn" onclick="location.reload()">← VOLVER</button>
    </div>

    <script>
        function startAdultAI() {
            const startScreen = document.getElementById('screen-start');
            const engineContainer = document.getElementById('avatar-engine-container');
            const iframe = document.getElementById('rpm-iframe');

            startScreen.style.display = 'none';
            engineContainer.style.display = 'block';

            /**
             * EXPLICACIÓN:
             * Esta URL es el motor de IA. Al cargar, pedirá permiso para usar la cámara.
             * Una vez te hagas la foto, la IA generará TU cara en un cuerpo 3D animado.
             */
            iframe.src = "https://sicnova.readyplayer.me/es/avatar?frameApi&theme=dark";
        }

        function startMinorFlow() {
            document.getElementById('screen-start').style.display = 'none';
            const minorScreen = document.getElementById('screen-minor');
            minorScreen.classList.add('active');
            document.getElementById('minor-video').play();
        }

        // Listener para detectar cuando el avatar está listo
        window.addEventListener('message', (event) => {
            const json = parse(event);
            if (json?.source === 'readyplayerme' && json?.eventName === 'v1.avatar.exported') {
                alert("¡Felicidades! Tu avatar 3D ha sido generado con éxito.");
                console.log("Avatar URL:", json.data.url);
            }
        });

        function parse(event) {
            try { return JSON.parse(event.data); } catch (e) { return null; }
        }
    </script>
</body>
</html>
