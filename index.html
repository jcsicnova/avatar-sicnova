<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sicnova - IES Santo Reino</title>
    <style>
        :root {
            --bg: #000000;
            --primary: #007bff;
            --text: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex; flex-direction: column;
            height: 100%; width: 100%;
            align-items: center; justify-content: center;
            text-align: center;
        }

        header {
            position: absolute; top: 0; width: 100%;
            padding: 20px; background: rgba(0,0,0,0.8);
            border-bottom: 1px solid #222; z-index: 10;
        }

        .screen { display: none; width: 90%; max-width: 500px; }
        .active { display: block; }

        .btn {
            display: block; width: 100%; padding: 20px; margin: 15px 0;
            border: none; border-radius: 15px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .btn-adult { background: var(--primary); color: white; }
        .btn-minor { background: #222; color: #fff; border: 1px solid #444; }

        /* Contenedor del Generador */
        #avatar-container {
            width: 100%; height: 100vh;
            display: none; position: relative;
        }

        iframe {
            width: 100%; height: 100%; border: none;
            background: #000;
        }

        video { width: 100%; border-radius: 15px; background: #000; }

        .back-btn {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.2);
            color: white; padding: 10px 20px; border-radius: 20px;
            text-decoration: none; font-size: 0.8rem; z-index: 20;
            border: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <span style="color:var(--primary); font-weight: bold;">SICNOVA</span> | IES SANTO REINO
    </header>

    <!-- PANTALLA INICIAL -->
    <div id="screen-start" class="container active">
        <h1>Generador de Avatar</h1>
        <p style="color:#888">Selecciona tu edad para comenzar</p>
        <div class="screen active">
            <button class="btn btn-adult" onclick="startAdult()">SOY ADULTO</button>
            <button class="btn btn-minor" onclick="startMinor()">SOY MENOR</button>
        </div>
    </div>

    <!-- PANTALLA MENOR (VIDEO) -->
    <div id="screen-video" class="container">
        <div class="screen active">
            <video id="player" controls>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
            <button class="back-btn" onclick="location.reload()">VOLVER</button>
        </div>
    </div>

    <!-- PANTALLA ADULTO (AVATAR) -->
    <div id="avatar-container">
        <!-- IMPORTANTE: Los permisos allow="camera;..." son críticos para Vercel -->
        <iframe 
            id="rpm-frame" 
            allow="camera *; microphone *; clipboard-write" 
            src="">
        </iframe>
        <button class="back-btn" onclick="location.reload()">SALIR DEL EDITOR</button>
    </div>

    <script>
        const startScreen = document.getElementById('screen-start');
        const videoScreen = document.getElementById('screen-video');
        const avatarContainer = document.getElementById('avatar-container');
        const frame = document.getElementById('rpm-frame');

        function startAdult() {
            startScreen.style.display = 'none';
            avatarContainer.style.display = 'block';
            
            // Usamos el subdominio 'demo' oficial que siempre está activo
            // 'theme=dark' pone el fondo negro en el editor
            frame.src = "https://demo.readyplayer.me/es/avatar?frameApi&theme=dark";
        }

        function startMinor() {
            startScreen.style.display = 'none';
            videoScreen.style.display = 'flex';
            document.getElementById('player').play();
        }

        // Manejo de errores por si el iframe es bloqueado por el navegador
        window.addEventListener('message', (event) => {
            // Aquí puedes recibir el modelo 3D cuando el usuario termine
            // console.log("Mensaje recibido:", event.data);
        });
    </script>
</body>
</html>
