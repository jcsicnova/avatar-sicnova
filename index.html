<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Santo Reino</title>
    <style>
        :root { --primary: #00f2ff; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; padding: 20px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; z-index: 100; }
        
        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: absolute; top: 0; left: 0; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        .btn { display: block; width: 100%; max-width: 300px; padding: 20px; margin: 15px 0; border: none; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        .btn-minor { background: transparent; color: #fff; border: 1px solid #444; }

        /* Contenedor del Generador de Avatar */
        #avatar-container { width: 100%; height: 100%; display: none; padding-top: 60px; box-sizing: border-box; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        /* Video de Menores */
        #minor-container { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        video { width: 90%; max-width: 500px; border-radius: 20px; border: 1px solid #333; }

        .back-btn { position: fixed; bottom: 20px; background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; z-index: 1000; }
    </style>
</head>
<body>

    <header><b>SICNOVA AI</b> | IES SANTO REINO</header>

    <!-- PANTALLA 1: SELECTOR -->
    <div id="screen-start" class="screen active">
        <h1 style="font-weight: 200;">Generador de <br><b style="color:var(--primary)">Avatar 3D Realista</b></h1>
        <p style="color: #666; margin-bottom: 30px;">Digitalización facial mediante IA</p>
        <button class="btn btn-primary" onclick="startAdultFlow()">Adulto (Crear mi Avatar)</button>
        <button class="btn btn-minor" onclick="startMinorFlow()">Menor de Edad</button>
    </div>

    <!-- PANTALLA 2: FLUJO ADULTOS (GENERADOR REAL) -->
    <div id="avatar-container">
        <!-- El allow="camera" es imprescindible para que el móvil no bloquee el selfie -->
        <iframe 
            id="rpm-frame" 
            allow="camera *; microphone *; clipboard-write" 
            src="">
        </iframe>
        <button class="back-btn" onclick="location.reload()">← VOLVER</button>
    </div>

    <!-- PANTALLA 3: FLUJO MENORES (VIDEO) -->
    <div id="minor-container" class="screen">
        <h2 style="margin-bottom: 20px;">Espacio Informativo</h2>
        <video id="minor-video" controls playsinline>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-btn" onclick="location.reload()">← VOLVER</button>
    </div>

    <script>
        const startScreen = document.getElementById('screen-start');
        const avatarContainer = document.getElementById('avatar-container');
        const minorContainer = document.getElementById('minor-container');
        const rpmFrame = document.getElementById('rpm-frame');
        const minorVideo = document.getElementById('minor-video');

        // FLUJO ADULTOS: Crea un avatar 3D real a partir de tu foto
        function startAdultFlow() {
            startScreen.style.display = 'none';
            avatarContainer.style.display = 'block';
            
            // URL oficial del creador de avatares (Optimizado para Sicnova)
            // Esto abrirá el asistente que te pide la foto y genera TU cara en 3D
            rpmFrame.src = "https://sicnova.readyplayer.me/es/avatar?frameApi&theme=dark";
        }

        // FLUJO MENORES: Solo video
        function startMinorFlow() {
            startScreen.style.display = 'none';
            minorContainer.style.display = 'flex';
            minorVideo.play();
        }

        // Escuchar cuando el avatar esté terminado
        window.addEventListener('message', (event) => {
            const json = parse(event);
            if (json?.source === 'readyplayerme' && json?.eventName === 'v1.avatar.exported') {
                alert("¡Avatar Personalizado Creado! Procesando archivo 3D...");
                console.log("URL del modelo 3D:", json.data.url);
            }
        });

        function parse(event) {
            try { return JSON.parse(event.data); } catch (e) { return null; }
        }
    </script>
</body>
</html>
