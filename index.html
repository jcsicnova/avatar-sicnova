<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI - Instituto Santo Reino</title>
    <style>
        :root {
            --bg: #000000;
            --primary: #00f2ff; /* Azul neón tipo IA */
            --accent: #7000ff;
            --text: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
        }

        /* Fondo con rejilla tecnológica */
        body {
            background-image: 
                linear-gradient(to right, #111 1px, transparent 1px),
                linear-gradient(to bottom, #111 1px, transparent 1px);
            background-size: 40px 40px;
        }

        header {
            position: fixed; top: 0; width: 100%; padding: 20px;
            text-align: center; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); border-bottom: 1px solid #222;
            z-index: 100; letter-spacing: 2px;
        }

        .container {
            display: none; flex-direction: column;
            height: 100vh; width: 100%;
            align-items: center; justify-content: center;
        }

        .active { display: flex; }

        /* Estilo Grok / AI */
        .glass-card {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #333;
            padding: 40px; border-radius: 24px;
            width: 85%; max-width: 400px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
        }

        h1 { font-weight: 300; font-size: 1.5rem; margin-bottom: 30px; }
        h1 span { color: var(--primary); font-weight: bold; }

        .btn {
            display: block; width: 100%; padding: 20px; margin: 15px 0;
            border: none; border-radius: 12px; font-size: 1rem;
            font-weight: bold; cursor: pointer; transition: 0.4s;
            text-transform: uppercase;
        }

        .btn-adult {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: black;
        }

        .btn-minor {
            background: transparent;
            color: white;
            border: 1px solid #444;
        }

        .btn:hover { transform: scale(1.02); opacity: 0.9; }

        /* Pantalla de Escaneo (Efecto Grok) */
        .scanner-line {
            position: absolute; width: 100%; height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            top: 0; animation: scan 3s infinite linear;
            display: none; z-index: 10;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Iframe & Video */
        iframe, video {
            width: 100%; height: 100%; border: none;
            background: #000; padding-top: 60px;
        }

        .back-btn {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            border: 1px solid #444; color: white;
            padding: 12px 25px; border-radius: 50px;
            cursor: pointer; z-index: 101;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <header>
        <span style="color:var(--primary)">SICNOVA</span> AI | SANTO REINO
    </header>

    <!-- PANTALLA 1: SELECTOR -->
    <div id="screen-selector" class="container active">
        <div class="glass-card">
            <h1>Generador de <span>Avatar Realista</span></h1>
            <p style="color: #666; margin-bottom: 30px;">Iniciando motor de renderizado neuronal...</p>
            <button class="btn btn-adult" onclick="startAdult()">Adulto (Escaneo IA)</button>
            <button class="btn btn-minor" onclick="startMinor()">Menor de Edad</button>
        </div>
    </div>

    <!-- PANTALLA 2: MENOR (VIDEO) -->
    <div id="screen-video" class="container">
        <video id="player" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-btn" onclick="location.reload()">← VOLVER</button>
    </div>

    <!-- PANTALLA 3: ADULTO (ANIMACIÓN IA) -->
    <div id="screen-avatar" class="container" style="justify-content: flex-start;">
        <div id="scanner" class="scanner-line"></div>
        <iframe id="engine-frame" allow="camera *; microphone *; clipboard-write"></iframe>
        <button class="back-btn" onclick="location.reload()">TERMINAR SESIÓN</button>
    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startAdult() {
            showScreen('screen-avatar');
            document.getElementById('scanner').style.display = 'block';
            
            const frame = document.getElementById('engine-frame');
            /* 
               AVATURN es el motor que crea el avatar idéntico a la foto y lo anima. 
               Es lo más parecido a Grok que existe para web.
            */
            frame.src = "https://demo.avaturn.me"; 

            frame.onload = () => {
                // El scanner desaparece cuando carga el motor
                setTimeout(() => {
                    document.getElementById('scanner').style.display = 'none';
                }, 2000);
            };
        }

        function startMinor() {
            showScreen('screen-video');
            document.getElementById('player').play();
        }
    </script>
</body>
</html>
