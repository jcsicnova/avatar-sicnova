<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Neural Avatar</title>
    <style>
        :root { --primary: #00f2ff; --bg: #000; --accent: #7000ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; padding: 20px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; z-index: 1000; backdrop-filter: blur(10px); }

        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        /* Estilo Botones Grok */
        .btn { display: block; width: 100%; max-width: 300px; padding: 20px; margin: 15px 0; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-primary { background: var(--primary); color: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #444; }

        /* Contenedor de Foto Real del Usuario */
        .user-frame { width: 180px; height: 180px; border-radius: 50%; border: 2px solid var(--primary); overflow: hidden; margin-bottom: 20px; position: relative; }
        #photo-result { width: 100%; height: 100%; object-fit: cover; }
        .scan-line { position: absolute; width: 100%; height: 4px; background: var(--primary); top: 0; animation: scan 2s infinite linear; box-shadow: 0 0 15px var(--primary); }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        /* Avatar Humano Animado */
        .avatar-video-box { width: 100%; max-width: 400px; border-radius: 24px; border: 1px solid #333; overflow: hidden; box-shadow: 0 0 50px rgba(112, 0, 255, 0.2); }
        video { width: 100%; display: block; background: #000; }

        .status-text { color: var(--primary); font-family: monospace; font-size: 0.8rem; margin-top: 10px; height: 20px; }
        .phrase-box { margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; width: 90%; max-width: 400px; font-style: italic; border-left: 3px solid var(--primary); }
    </style>
</head>
<body>

    <header><b>SICNOVA AI</b> | IES SANTO REINO</header>

    <!-- 1. INICIO -->
    <div id="screen-home" class="screen active">
        <h1 style="font-weight: 200;">Generador de <br><b style="color:var(--primary)">Avatar Neural</b></h1>
        <button class="btn btn-primary" onclick="showScreen('screen-capture')">Adulto (Escaneo)</button>
        <button class="btn btn-outline" onclick="startMinor()">Menor de Edad</button>
    </div>

    <!-- 2. CAPTURA Y ESCANEO -->
    <div id="screen-capture" class="screen">
        <div class="user-frame" id="frame-capture" style="display:none">
            <div class="scan-line"></div>
            <img id="user-preview" src="">
        </div>
        <p id="instruction" style="color: #444;">Hazte un selfie para iniciar la animación</p>
        <input type="file" id="camera-input" accept="image/*" capture="user" style="display:none" onchange="processIA(this)">
        <button class="btn btn-primary" id="snap-btn" onclick="document.getElementById('camera-input').click()">Hacer Foto</button>
        <div id="status" class="status-text"></div>
    </div>

    <!-- 3. RESULTADO: AVATAR HABLANDO -->
    <div id="screen-result" class="screen">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
            <div class="user-frame" style="width: 80px; height: 80px; margin-bottom: 0;">
                <img id="user-small" src="">
            </div>
            <div style="text-align: left;">
                <h3 style="margin: 0; color: var(--primary);">Gemelo Digital</h3>
                <small style="color: #666;">Sincronización Labial Activa</small>
            </div>
        </div>

        <div class="avatar-video-box">
            <!-- Vídeo de un humano digital realista hablando -->
            <video id="avatar-vid" playsinline loop muted>
                <source src="https://v.ftcdn.net/05/56/63/01/700_F_556630132_K2MDRQ3FasR9fOsh4X6S9E3V9E3pX1G9_ST.mp4" type="video/mp4">
            </video>
        </div>

        <div class="phrase-box" id="text-display">"Iniciando síntesis de voz..."</div>

        <button class="btn btn-primary" id="play-btn" onclick="startTalking()">ACTIVAR AVATAR Y VOZ</button>
        <button class="btn btn-outline" style="max-width: 150px; font-size: 0.7rem;" onclick="location.reload()">Nuevo Escaneo</button>
    </div>

    <!-- 4. MENORES -->
    <div id="screen-minor" class="screen">
        <video id="minor-vid" controls playsinline style="width:100%; max-width:400px; border-radius:20px;">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="btn btn-outline" onclick="location.reload()">Volver</button>
    </div>

    <script>
        // LA FRASE CONCRETA DE SICNOVA
        const fraseSicnova = "Hola, soy tu avatar generado por inteligencia artificial para Sicnova y el Instituto Santo Reino. Mi proceso de animación neuronal ha finalizado con éxito.";

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startMinor() {
            showScreen('screen-minor');
            document.getElementById('minor-vid').play();
        }

        function processIA(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('instruction').style.display = 'none';
                    document.getElementById('frame-capture').style.display = 'block';
                    document.getElementById('user-preview').src = e.target.result;
                    document.getElementById('user-small').src = e.target.result;
                    document.getElementById('snap-btn').style.display = 'none';
                    
                    const status = document.getElementById('status');
                    status.innerText = "EXTRAYENDO RASGOS...";
                    setTimeout(() => status.innerText = "MAPEO FACIAL COMPLETO...", 1500);
                    setTimeout(() => status.innerText = "GENERANDO ANIMACIÓN NEURAL...", 3000);
                    setTimeout(() => showScreen('screen-result'), 4500);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function startTalking() {
            const vid = document.getElementById('avatar-vid');
            const btn = document.getElementById('play-btn');
            const textDisplay = document.getElementById('text-display');

            vid.muted = false;
            vid.play();
            btn.style.display = 'none';
            textDisplay.innerText = fraseSicnova;

            // LÓGICA DE VOZ (Synthesizer)
            const utterance = new SpeechSynthesisUtterance(fraseSicnova);
            utterance.lang = 'es-ES';
            utterance.rate = 0.9; // Un poco más lento para que sea realista
            utterance.pitch = 1;
            
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
