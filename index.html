<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Generador de Avatares</title>
    <style>
        :root { --primary: #00f2ff; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; padding: 20px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; z-index: 1000; backdrop-filter: blur(10px); }

        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        .btn { display: block; width: 100%; max-width: 300px; padding: 22px; margin: 15px 0; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-adult { background: linear-gradient(90deg, var(--primary), #7000ff); color: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        .btn-minor { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        /* CONTENEDOR DEL MOTOR IA */
        #ai-engine-container { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 500; background: #000; }
        iframe { width: 100%; height: 100%; border: none; padding-top: 60px; box-sizing: border-box; }

        /* INTERFAZ DE VOZ */
        .voice-controls { position: fixed; bottom: 80px; width: 100%; text-align: center; z-index: 1001; display: none; }
        .phrase-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid var(--primary); margin: 0 auto 10px; width: 80%; max-width: 400px; font-style: italic; }

        .back-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #444; padding: 10px 25px; border-radius: 50px; cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

    <header><b>SICNOVA AI</b> | IES SANTO REINO</header>

    <!-- 1. SELECTOR -->
    <div id="screen-start" class="screen active">
        <h1 style="font-weight: 200;">Generador de <br><b style="color:var(--primary)">Avatar 3D Realista</b></h1>
        <p style="color:#666; margin-bottom: 30px;">Digitalización facial mediante IA</p>
        <button class="btn btn-adult" onclick="startAI()">Adulto (Crear mi Avatar)</button>
        <button class="btn btn-minor" onclick="startMinor()">Menor de Edad</button>
    </div>

    <!-- 2. MOTOR DE IA (IFRAME) -->
    <div id="ai-engine-container">
        <!-- Motor de Avaturn: Genera el avatar real de la foto -->
        <iframe 
            id="ai-iframe" 
            allow="camera *; microphone *; clipboard-write; autoplay" 
            src="">
        </iframe>

        <!-- Control de Voz -->
        <div class="voice-controls" id="voice-ui">
            <div class="phrase-box" id="text-to-speak">
                "Hola, soy tu avatar de Sicnova. Mi proceso de digitalización ha finalizado."
            </div>
            <button class="btn btn-adult" style="max-width: 200px; padding: 10px;" onclick="speakPhrase()">Activar Voz</button>
        </div>

        <button class="back-btn" onclick="location.reload()">← VOLVER AL INICIO</button>
    </div>

    <!-- 3. MENORES -->
    <div id="screen-minor" class="screen">
        <video id="minor-video" controls playsinline style="width:100%; max-width:400px; border-radius:20px;">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-btn" onclick="location.reload()">← VOLVER</button>
    </div>

    <script>
        const fraseSicnova = "Hola, soy tu avatar generado por inteligencia artificial para Sicnova y el Instituto Santo Reino. Mi proceso de animación neuronal ha finalizado con éxito.";

        function startAI() {
            document.getElementById('screen-start').style.display = 'none';
            document.getElementById('ai-engine-container').style.display = 'block';
            document.getElementById('voice-ui').style.display = 'block';
            
            const iframe = document.getElementById('ai-iframe');
            // Cargamos Avaturn (Motor de IA Realista)
            iframe.src = "https://avaturn.me"; 
        }

        function startMinor() {
            document.getElementById('screen-start').style.display = 'none';
            const minorScreen = document.getElementById('screen-minor');
            minorScreen.classList.add('active');
            document.getElementById('minor-video').play();
        }

        function speakPhrase() {
            // Lógica de síntesis de voz del navegador
            const msg = new SpeechSynthesisUtterance(fraseSicnova);
            msg.lang = 'es-ES';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
            
            document.getElementById('text-to-speak').innerText = fraseSicnova;
        }
    </script>
</body>
</html>
