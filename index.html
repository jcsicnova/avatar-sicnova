<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Santo Reino</title>
    <style>
        :root { --primary: #00f2ff; --bg: #000; --accent: #7000ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; padding: 20px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; z-index: 100; backdrop-filter: blur(10px); }

        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        /* Botones */
        .btn { display: block; width: 100%; max-width: 300px; padding: 20px; margin: 12px 0; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-adult { background: linear-gradient(90deg, var(--primary), var(--accent)); color: #000; }
        .btn-minor { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        /* Área de Escaneo */
        .scan-container { width: 280px; height: 280px; border: 1px solid #333; border-radius: 20px; position: relative; overflow: hidden; background: #050505; margin-bottom: 20px; }
        #user-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .laser { position: absolute; width: 100%; height: 4px; background: var(--primary); top: 0; display: none; animation: scan 2s infinite ease-in-out; box-shadow: 0 0 15px var(--primary); z-index: 10; }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        /* Avatar Resultado (Talking Head) */
        .avatar-box { width: 100%; max-width: 400px; border-radius: 24px; overflow: hidden; border: 1px solid var(--primary); box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); display: none; }
        video { width: 100%; display: block; background: #000; }

        .status-info { color: var(--primary); font-family: monospace; font-size: 0.9rem; margin-top: 10px; }
        .back-link { position: fixed; bottom: 30px; color: #444; background: none; border: none; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <header><b>SICNOVA AI</b> | IES SANTO REINO</header>

    <!-- 1. INICIO -->
    <div id="screen-home" class="screen active">
        <h1 style="font-weight: 200;">Generador de <br><b style="color:var(--primary)">Avatares IA</b></h1>
        <button class="btn btn-adult" onclick="showScreen('screen-upload')">Adulto (Selfie)</button>
        <button class="btn btn-minor" onclick="startMinor()">Menor de Edad</button>
    </div>

    <!-- 2. UPLOAD / SCAN -->
    <div id="screen-upload" class="screen">
        <div class="scan-container">
            <div id="laser" class="laser"></div>
            <img id="user-img" src="">
            <div id="msg-cam" style="margin-top:110px; color:#333;">Esperando rostro...</div>
        </div>
        <input type="file" id="cam-input" accept="image/*" capture="user" style="display:none" onchange="processIA(this)">
        <button class="btn btn-adult" id="snap-btn" onclick="document.getElementById('cam-input').click()">Hacer Foto</button>
        <div id="ai-status" class="status-info"></div>
        <button class="back-link" onclick="location.reload()">Cancelar</button>
    </div>

    <!-- 3. RESULTADO (EL AVATAR HABLANDO EN TU WEB) -->
    <div id="screen-result" class="screen">
        <div class="avatar-box" id="avatar-box">
            <!-- Este es un avatar realista de IA hablando (Talking Head) -->
            <video id="avatar-vid" playsinline webkit-playsinline>
                <source src="https://v.ftcdn.net/05/56/63/01/700_F_556630132_K2MDRQ3FasR9fOsh4X6S9E3V9E3pX1G9_ST.mp4" type="video/mp4">
            </video>
        </div>
        <h3 id="phrase" style="color:var(--primary); margin-top: 20px; font-style: italic; opacity: 0;">"Digitalización completa. Bienvenido a Sicnova."</h3>
        <button class="btn btn-adult" id="play-btn" onclick="animateAvatar()">Activar Avatar</button>
        <button class="back-link" onclick="location.reload()">Nuevo escaneo</button>
    </div>

    <!-- 4. MENORES -->
    <div id="screen-minor" class="screen">
        <video id="minor-vid" controls playsinline style="width:100%; max-width:400px; border-radius:20px;">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-link" onclick="location.reload()">Volver</button>
    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startMinor() {
            showScreen('screen-minor');
            document.getElementById('minor-vid').play();
        }

        function processIA(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('msg-cam').style.display = 'none';
                    const img = document.getElementById('user-img');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    
                    document.getElementById('laser').style.display = 'block';
                    document.getElementById('snap-btn').style.display = 'none';
                    const status = document.getElementById('ai-status');

                    // Simulación Grok de Procesamiento
                    status.innerText = "EXTRAYENDO RASGOS...";
                    setTimeout(() => status.innerText = "GENERANDO AVATAR REALISTA...", 1500);
                    setTimeout(() => status.innerText = "SINCRO DE VOZ NEURONAL...", 3000);
                    setTimeout(() => showScreen('screen-result'), 4500);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function animateAvatar() {
            const vid = document.getElementById('avatar-vid');
            document.getElementById('avatar-box').style.display = 'block';
            document.getElementById('play-btn').style.display = 'none';
            document.getElementById('phrase').style.opacity = '1';
            vid.play();
        }
    </script>
</body>
</html>
