<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Santo Reino</title>
    <style>
        :root { --primary: #00f2ff; --bg: #000; --accent: #7000ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100%; align-items: center; justify-content: center; }
        header { position: fixed; top: 0; width: 100%; padding: 25px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; z-index: 100; backdrop-filter: blur(10px); }
        
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; text-align: center; }
        .active { display: flex; }

        /* Estilo Grok / Sicnova */
        h1 { font-weight: 200; font-size: 2.2rem; margin-bottom: 10px; }
        h1 b { color: var(--primary); text-shadow: 0 0 20px rgba(0, 242, 255, 0.5); }
        .subtitle { color: #555; margin-bottom: 40px; letter-spacing: 1px; }

        .btn { display: block; width: 100%; max-width: 320px; padding: 22px; margin: 12px 0; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.4s; text-transform: uppercase; }
        .btn-adult { background: linear-gradient(90deg, var(--primary), var(--accent)); color: #000; }
        .btn-minor { background: #111; color: #fff; border: 1px solid #333; }
        .btn:active { transform: scale(0.96); }

        /* Visualizador de Foto y Escáner */
        .preview-circle { width: 280px; height: 280px; border: 2px solid #222; border-radius: 50%; position: relative; overflow: hidden; background: #080808; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; }
        #photo-result { width: 100%; height: 100%; object-fit: cover; display: none; }
        .scanner-line { position: absolute; width: 100%; height: 5px; background: var(--primary); top: 0; display: none; animation: scan 2s infinite ease-in-out; box-shadow: 0 0 20px var(--primary); z-index: 10; }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        .loading-bar { width: 100%; max-width: 280px; height: 4px; background: #111; border-radius: 10px; margin-top: 20px; display: none; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: var(--primary); animation: progress 4s forwards; }
        @keyframes progress { to { width: 100%; } }

        video { width: 100%; max-width: 500px; border-radius: 20px; box-shadow: 0 0 40px rgba(0,0,0,1); }
        .back-btn { position: fixed; bottom: 30px; color: #444; background: none; border: none; cursor: pointer; font-size: 0.9rem; text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <span style="letter-spacing: 3px;"><b>SICNOVA</b> AI</span>
    </header>

    <div class="app-container">

        <!-- PANTALLA 1: SELECTOR -->
        <div id="screen-selector" class="screen active">
            <h1>Motor <b>Neuronal</b></h1>
            <p class="subtitle">IES SANTO REINO</p>
            <button class="btn btn-adult" onclick="goToUpload()">Acceso Adulto</button>
            <button class="btn btn-minor" onclick="goToMinor()">Acceso Menor</button>
        </div>

        <!-- PANTALLA 2: CAPTURA (ADULTO) -->
        <div id="screen-upload" class="screen">
            <div class="preview-circle">
                <div id="scanner" class="scanner-line"></div>
                <img id="photo-result" src="">
                <span id="label" style="color:#333">Esperando<br>Captura</span>
            </div>

            <input type="file" id="input-cam" accept="image/*" capture="user" style="display:none" onchange="handlePhoto(this)">
            
            <button id="btn-main" class="btn btn-adult" onclick="document.getElementById('input-cam').click()">Hacer Selfie</button>
            
            <div id="status-container" style="display:none">
                <p id="status-text" style="color:var(--primary); font-family: monospace;">ANALIZANDO ROSTRO...</p>
                <div class="loading-bar" style="display:block;"><div class="loading-progress"></div></div>
            </div>

            <button class="back-btn" onclick="location.reload()">CANCELAR</button>
        </div>

        <!-- PANTALLA 3: MENOR (VIDEO) -->
        <div id="screen-minor" class="screen">
            <video id="minor-video" controls playsinline>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
            <button class="back-btn" onclick="location.reload()">VOLVER</button>
        </div>

    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goToUpload() { showScreen('screen-upload'); }

        function goToMinor() { 
            showScreen('screen-minor'); 
            document.getElementById('minor-video').play(); 
        }

        function handlePhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Mostrar Foto
                    document.getElementById('label').style.display = 'none';
                    const img = document.getElementById('photo-result');
                    img.src = e.target.result;
                    img.style.display = 'block';

                    // Iniciar Animación IA estilo Grok
                    document.getElementById('scanner').style.display = 'block';
                    document.getElementById('btn-main').style.display = 'none';
                    document.getElementById('status-container').style.display = 'block';

                    const status = document.getElementById('status-text');
                    setTimeout(() => status.innerText = "GENERANDO MALLA 3D...", 1500);
                    setTimeout(() => status.innerText = "SINCRO NEURONAL...", 3000);
                    
                    // PASO FINAL: Redirección al motor global para evitar bloqueos de IP
                    setTimeout(() => {
                        // Usamos la URL raíz que NO depende de subdominios 'demo'
                        window.location.href = "https://readyplayer.me/es/avatar?theme=dark";
                    }, 4500);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
