<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Santo Reino</title>
    <style>
        :root { --bg: #000; --primary: #00f2ff; --text: #fff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; padding: 20px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; z-index: 100; font-size: 0.9rem; }
        
        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        .btn { display: block; width: 100%; max-width: 280px; padding: 18px; margin: 10px 0; border: none; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-primary { background: var(--primary); color: #000; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #444; }

        /* Área de foto */
        .preview-box { width: 250px; height: 250px; border: 2px solid #222; border-radius: 20px; position: relative; overflow: hidden; background: #050505; margin-bottom: 20px; }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .scan-line { position: absolute; width: 100%; height: 3px; background: var(--primary); top: 0; display: none; animation: scan 2s infinite linear; box-shadow: 0 0 10px var(--primary); }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        /* VIDEO FIX */
        #video-wrapper { width: 100%; max-width: 350px; display: none; margin-bottom: 20px; border-radius: 15px; overflow: hidden; border: 1px solid var(--primary); background: #111; }
        video { width: 100%; display: block; }

        .loader-text { color: var(--primary); font-family: monospace; font-size: 0.8rem; margin: 10px 0; display: none; }
        .back-link { margin-top: 30px; color: #555; cursor: pointer; text-decoration: underline; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header><b>SICNOVA AI</b> | IES SANTO REINO</header>

    <!-- 1. INICIO -->
    <div id="screen-start" class="screen active">
        <h1 style="font-weight: 300;">Digitalización <br><b>Neuronal</b></h1>
        <button class="btn btn-primary" onclick="showScreen('screen-upload')">Adulto (Escaneo)</button>
        <button class="btn btn-outline" onclick="startMinor()">Menor de Edad</button>
    </div>

    <!-- 2. SUBIR FOTO -->
    <div id="screen-upload" class="screen">
        <div class="preview-box">
            <div id="scanner" class="scan-line"></div>
            <img id="preview-img" src="">
            <div id="tap-msg" style="margin-top: 100px; color: #444;">Toca el botón para<br>hacerte un selfie</div>
        </div>
        
        <input type="file" id="fileInput" accept="image/*" capture="user" style="display:none" onchange="processImage(this)">
        
        <button class="btn btn-primary" id="btn-cap" onclick="document.getElementById('fileInput').click()">Hacer Foto</button>
        <div id="status-msg" class="loader-text">INICIANDO IA...</div>
        <button class="back-link" onclick="location.reload()">Cancelar</button>
    </div>

    <!-- 3. RESULTADO (VIDEO) -->
    <div id="screen-result" class="screen">
        <h2 style="color:var(--primary); margin: 0;">Avatar Animado</h2>
        <p style="color:#666; font-size: 0.8rem; margin-bottom: 20px;">Sincronización labial mediante IA</p>

        <div id="video-wrapper">
            <!-- He cambiado el video por uno de Cloudinary (muy compatible con iPhone) -->
            <video id="avatar-video" playsinline webkit-playsinline>
                <source src="https://res.cloudinary.com/demo/video/upload/v1617116104/sample_video.mp4" type="video/mp4">
            </video>
        </div>

        <button class="btn btn-primary" id="play-btn" onclick="playVideo()">VER ANIMACIÓN</button>
        
        <p style="color:var(--primary); font-style: italic; font-size: 0.9rem;">IA de Sicnova: Digitalización completa.</p>
        <button class="back-link" onclick="location.reload()">Nuevo escaneo</button>
    </div>

    <!-- 4. MENORES -->
    <div id="screen-minor" class="screen">
        <video id="minor-video" controls playsinline style="width:100%; max-width:350px;">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-link" onclick="location.reload()">Volver</button>
    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startMinor() {
            showScreen('screen-minor');
            document.getElementById('minor-video').play();
        }

        function processImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('tap-msg').style.display = 'none';
                    const img = document.getElementById('preview-img');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    
                    document.getElementById('scanner').style.display = 'block';
                    document.getElementById('status-msg').style.display = 'block';
                    document.getElementById('btn-cap').style.display = 'none';

                    // Simulación de carga
                    setTimeout(() => { document.getElementById('status-msg').innerText = "GENERANDO AVATAR..."; }, 1500);
                    setTimeout(() => { showScreen('screen-result'); }, 3500);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function playVideo() {
            const vid = document.getElementById('avatar-video');
            const wrapper = document.getElementById('video-wrapper');
            const btn = document.getElementById('play-btn');
            
            wrapper.style.display = 'block';
            btn.style.display = 'none';
            
            // Forzar reproducción
            const promise = vid.play();
            if (promise !== undefined) {
                promise.catch(error => {
                    console.log("Error al reproducir: ", error);
                    alert("Toca de nuevo para reproducir");
                });
            }
        }
    </script>
</body>
</html>
