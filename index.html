<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Generador de Avatares</title>
    <style>
        :root {
            --bg: #000000;
            --primary: #00f2ff;
            --text: #ffffff;
            --card: #111111;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Pantalla de Selección */
        .container {
            display: flex; flex-direction: column;
            width: 100%; height: 100%;
            align-items: center; justify-content: center;
            position: absolute; top: 0; left: 0;
            transition: opacity 0.5s;
            z-index: 10;
        }

        header {
            position: fixed; top: 0; width: 100%; padding: 20px;
            text-align: center; background: rgba(0,0,0,0.8);
            border-bottom: 1px solid #222; backdrop-filter: blur(10px);
            z-index: 100;
        }

        .btn {
            width: 85%; max-width: 320px; padding: 20px;
            margin: 15px 0; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            transition: transform 0.2s;
        }

        .btn-adult {
            background: linear-gradient(45deg, var(--primary), #7000ff);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .btn-minor {
            background: #222; color: #fff; border: 1px solid #333;
        }

        /* MOTOR DE IA (ADULTO) */
        #ai-engine-wrapper {
            display: none; width: 100%; height: 100%;
            background: #000; position: absolute; top: 0; left: 0;
            z-index: 50;
        }

        iframe {
            width: 100%; height: 100%; border: none;
            padding-top: 60px; box-sizing: border-box;
        }

        /* SECCIÓN MENORES (VIDEO) */
        #minor-section {
            display: none; width: 100%; height: 100%;
            background: #000; z-index: 60;
            flex-direction: column; align-items: center; justify-content: center;
        }

        video { width: 90%; max-width: 500px; border-radius: 15px; border: 1px solid #333; }

        .back-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #444;
            padding: 10px 25px; border-radius: 50px; z-index: 1000; cursor: pointer;
        }

        h1 { font-weight: 200; font-size: 1.8rem; margin-bottom: 10px; }
        b { color: var(--primary); }
    </style>
</head>
<body>

    <header id="app-header">
        <span style="color:var(--primary)">SICNOVA AI</span> | SANTO REINO
    </header>

    <!-- PANTALLA DE INICIO -->
    <div id="selector-screen" class="container">
        <h1>Generador <b>Grok-Style</b></h1>
        <p style="color: #666; margin-bottom: 40px;">Digitalización facial hiperrealista</p>
        
        <button class="btn btn-adult" onclick="loadAIEngine()">Acceso Adulto</button>
        <button class="btn btn-minor" onclick="loadMinorVideo()">Acceso Menor</button>
    </div>

    <!-- CONTENEDOR DEL MOTOR IA (ADULTO) -->
    <div id="ai-engine-wrapper">
        <!-- IMPORTANTE: Atributos de cámara obligatorios para móviles -->
        <iframe 
            id="ai-iframe"
            allow="camera; microphone; autoplay; encrypted-media; fullscreen;"
            src="">
        </iframe>
        <button class="back-btn" onclick="location.reload()">SALIR</button>
    </div>

    <!-- SECCIÓN DE MENORES -->
    <div id="minor-section" class="container">
        <video id="minor-video" controls playsinline>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-btn" onclick="location.reload()">VOLVER</button>
    </div>

    <script>
        /**
         * EXPLICACIÓN TÉCNICA:
         * Para que el avatar se GENERE a partir de la foto, usamos Avaturn.
         * Avaturn permite: 1. Hacerse un selfie, 2. La IA lo procesa en segundos,
         * 3. Crea un modelo 3D realista animado de la persona.
         */

        function loadAIEngine() {
            const selector = document.getElementById('selector-screen');
            const wrapper = document.getElementById('ai-engine-wrapper');
            const iframe = document.getElementById('ai-iframe');
            const header = document.getElementById('app-header');

            // 1. Ocultamos la UI inicial
            selector.style.display = 'none';
            header.style.display = 'none';
            
            // 2. Mostramos el contenedor del motor
            wrapper.style.display = 'block';

            // 3. Cargamos el motor (Avaturn es mucho más realista que Ready Player Me)
            // Esta URL lanza el proceso de captura de foto inmediatamente.
            iframe.src = "https://demo.avaturn.me";
        }

        function loadMinorVideo() {
            const selector = document.getElementById('selector-screen');
            const minorSec = document.getElementById('minor-section');
            const video = document.getElementById('minor-video');

            selector.style.display = 'none';
            minorSec.style.display = 'flex';
            video.play();
        }

        // Bloqueo de errores de carga
        window.onerror = function() {
            console.log("Error detectado en el motor de IA. Reintentando...");
        };
    </script>
</body>
</html>
