<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova - IES Santo Reino</title>
    <style>
        :root {
            --bg: #000000;
            --primary: #007bff;
            --text: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; /* Evita scrolls extraños en el móvil */
        }

        /* Contenedor para centrar contenido */
        .full-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            background: var(--bg);
        }

        .active { display: flex; }

        header {
            position: fixed; top: 0; width: 100%;
            padding: 20px; text-align: center;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid #222; z-index: 100;
        }

        /* Botones */
        .menu-box { width: 90%; max-width: 400px; text-align: center; }
        
        .btn {
            display: block; width: 100%; padding: 22px; margin: 20px 0;
            border: none; border-radius: 15px; font-size: 1.2rem;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-adult { background: var(--primary); color: white; box-shadow: 0 5px 15px rgba(0,123,255,0.4); }
        .btn-minor { background: #222; color: #aaa; border: 1px solid #444; }

        /* Estilo Video */
        video { width: 95%; max-width: 600px; border-radius: 15px; box-shadow: 0 0 30px rgba(255,255,255,0.1); }

        /* Iframe Avatar */
        iframe { width: 100%; height: 100%; border: none; padding-top: 60px; }

        .btn-back {
            position: fixed; bottom: 20px;
            background: rgba(255,255,255,0.1);
            color: white; padding: 10px 20px; border-radius: 30px;
            border: 1px solid #444; z-index: 101; cursor: pointer;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <span style="color:var(--primary); font-weight: bold;">SICNOVA</span> | IES SANTO REINO
    </header>

    <!-- PANTALLA 1: SELECTOR -->
    <div id="screen-selector" class="full-screen active">
        <div class="menu-box">
            <h1>Bienvenido</h1>
            <p style="color:#888; margin-bottom: 40px;">Selecciona tu rango de edad para continuar</p>
            <button class="btn btn-adult" onclick="goToAdult()">Soy Adulto (+18)</button>
            <button class="btn btn-minor" onclick="goToMinor()">Soy Menor de Edad</button>
        </div>
    </div>

    <!-- PANTALLA 2: MENOR (VIDEO) -->
    <div id="screen-video" class="full-screen">
        <video id="main-video" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Tu navegador no soporta video.
        </video>
        <button class="btn-back" onclick="resetApp()">← VOLVER AL INICIO</button>
    </div>

    <!-- PANTALLA 3: ADULTO (AVATAR/CÁMARA) -->
    <div id="screen-avatar" class="full-screen">
        <!-- El allow="camera" es vital para que Vercel habilite la cámara del móvil -->
        <iframe 
            id="avatar-iframe" 
            allow="camera *; microphone *; clipboard-write"
            src="">
        </iframe>
        <button class="btn-back" onclick="resetApp()">← SALIR DEL ESCÁNER</button>
    </div>

    <script>
        const sSelector = document.getElementById('screen-selector');
        const sVideo = document.getElementById('screen-video');
        const sAvatar = document.getElementById('screen-avatar');
        
        const videoPlayer = document.getElementById('main-video');
        const iframe = document.getElementById('avatar-iframe');
        const header = document.getElementById('main-header');

        // FUNCIÓN PARA ADULTOS
        function goToAdult() {
            // 1. Ocultar selector
            sSelector.classList.remove('active');
            // 2. Mostrar contenedor de avatar
            sAvatar.classList.add('active');
            // 3. Cargar el motor (Ready Player Me con tema oscuro)
            // Se usa el subdominio 'demo' que es el más estable
            iframe.src = "https://demo.readyplayer.me/es/avatar?frameApi&theme=dark";
        }

        // FUNCIÓN PARA MENORES
        function goToMinor() {
            // 1. Ocultar selector
            sSelector.classList.remove('active');
            // 2. Mostrar contenedor de video
            sVideo.classList.add('active');
            // 3. Reproducir video
            videoPlayer.play();
        }

        // FUNCIÓN RESET (VOLVER)
        function resetApp() {
            // Pausar video y limpiar iframe
            videoPlayer.pause();
            videoPlayer.currentTime = 0;
            iframe.src = "";
            
            // Alternar pantallas
            sVideo.classList.remove('active');
            sAvatar.classList.remove('active');
            sSelector.classList.add('active');
        }
    </script>
</body>
</html>
