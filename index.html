<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Santo Reino</title>
    <style>
        :root {
            --bg: #000000;
            --primary: #00f2ff;
            --accent: #7000ff;
            --text: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        /* Estética Grok (Fondo oscuro con aura) */
        body::before {
            content: ""; position: absolute; width: 300px; height: 300px;
            background: var(--accent); filter: blur(150px);
            opacity: 0.2; top: -50px; right: -50px; z-index: -1;
        }

        .screen {
            display: none; width: 100%; height: 100vh;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; box-sizing: border-box;
        }

        .active { display: flex; }

        header {
            position: fixed; top: 0; width: 100%; padding: 20px;
            text-align: center; background: rgba(0,0,0,0.8);
            border-bottom: 1px solid #222; z-index: 100;
        }

        .btn {
            display: block; width: 100%; max-width: 300px; padding: 20px;
            margin: 15px 0; border: none; border-radius: 50px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            transition: 0.3s; text-transform: uppercase;
        }

        .btn-primary { background: var(--primary); color: #000; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #444; }

        /* Estilo Cámara / Upload */
        .upload-area {
            width: 250px; height: 250px; border: 2px dashed #444;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; margin-bottom: 30px; overflow: hidden;
            background: #0a0a0a; position: relative;
        }

        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }

        /* Barra de carga IA */
        .ai-loader {
            width: 80%; max-width: 300px; height: 4px;
            background: #222; border-radius: 10px; overflow: hidden;
            margin-top: 20px; display: none;
        }
        .ai-loader div {
            width: 0%; height: 100%; background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            animation: load 4s forwards;
        }

        @keyframes load { to { width: 100%; } }

        video { width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 0 50px rgba(0, 242, 255, 0.2); }

        .back-btn { position: fixed; bottom: 30px; color: #666; background: none; border: none; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <span style="color:var(--primary)">SICNOVA</span> AI | SANTO REINO
    </header>

    <!-- 1. PANTALLA INICIAL -->
    <div id="screen-start" class="screen active">
        <h1 style="font-weight: 200;">Motor de <br><b>Animación Neuronal</b></h1>
        <button class="btn btn-primary" onclick="showScreen('screen-upload')">Adulto (Subir Foto)</button>
        <button class="btn btn-outline" onclick="playMinorVideo()">Menor de Edad</button>
    </div>

    <!-- 2. PANTALLA SUBIR FOTO -->
    <div id="screen-upload" class="screen">
        <h2>Paso 1: Captura</h2>
        <p style="color: #666;">Sube un archivo o hazte un selfie</p>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <span id="label-upload">📸<br>Tocar para<br>hacer foto</span>
            <img id="preview-img" src="" alt="Preview">
        </div>
        
        <input type="file" id="fileInput" accept="image/*" capture="user" style="display:none" onchange="handleImage(this)">
        
        <div id="ai-status" style="display:none">
            <p id="status-text">Analizando rasgos faciales...</p>
            <div class="ai-loader" id="loader"><div id="bar"></div></div>
        </div>

        <button class="back-btn" onclick="location.reload()">Cancelar</button>
    </div>

    <!-- 3. PANTALLA RESULTADO (ANIMACIÓN) -->
    <div id="screen-result" class="screen">
        <h2 style="color:var(--primary)">Avatar Generado</h2>
        <!-- Este video simula el avatar animado estilo Grok -->
        <video id="avatar-video" playsinline>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <p id="phrase-text" style="margin-top: 20px; font-style: italic; color: #888;">"Procesando voz sintética..."</p>
        <button class="btn btn-outline" onclick="location.reload()" style="margin-top: 20px;">Repetir</button>
    </div>

    <!-- 4. PANTALLA MENOR -->
    <div id="screen-minor" class="screen">
        <video id="minor-video" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-btn" onclick="location.reload()">Volver al inicio</button>
    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function playMinorVideo() {
            showScreen('screen-minor');
            document.getElementById('minor-video').play();
        }

        function handleImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Mostrar preview
                    document.getElementById('label-upload').style.display = 'none';
                    const img = document.getElementById('preview-img');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    
                    // Simular Proceso Grok
                    processAI();
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function processAI() {
            const statusText = document.getElementById('status-text');
            const aiStatus = document.getElementById('ai-status');
            aiStatus.style.display = 'block';

            const steps = [
                "Mapeando puntos faciales...",
                "Generando malla 3D...",
                "Sincronizando redes neuronales...",
                "Finalizando animación..."
            ];

            let i = 0;
            const interval = setInterval(() => {
                statusText.innerText = steps[i];
                i++;
                if (i >= steps.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        finishAvatar();
                    }, 1000);
                }
            }, 1000);
        }

        function finishAvatar() {
            showScreen('screen-result');
            const vid = document.getElementById('avatar-video');
            vid.play();
            // Aquí es donde pondrás la frase concreta que me digas
            document.getElementById('phrase-text').innerText = "Cargando frase personalizada de Sicnova...";
        }
    </script>
</body>
</html>
