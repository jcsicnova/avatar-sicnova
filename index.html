<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Digital Twin</title>
    <!-- Librería 3D de Google (Estándar Industrial, difícil de bloquear) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --primary: #00f2ff; --bg: #000; --accent: #7000ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; padding: 20px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; z-index: 1000; backdrop-filter: blur(10px); }

        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; position: absolute; }
        .active { display: flex; }

        /* Botones estilo Grok */
        .btn { display: block; width: 100%; max-width: 300px; padding: 22px; margin: 12px 0; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-adult { background: linear-gradient(90deg, var(--primary), var(--accent)); color: #000; box-shadow: 0 0 25px rgba(0, 242, 255, 0.4); }
        .btn-minor { background: #111; color: #fff; border: 1px solid #333; }

        /* Escáner de Rostro */
        .preview-circle { width: 260px; height: 260px; border: 2px solid #222; border-radius: 50%; position: relative; overflow: hidden; background: #080808; margin-bottom: 30px; }
        #photo-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
        .laser-line { position: absolute; width: 100%; height: 4px; background: var(--primary); top: 0; display: none; animation: scan 2s infinite ease-in-out; box-shadow: 0 0 15px var(--primary); z-index: 10; }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        /* VISUALIZADOR 3D (El Avatar) */
        model-viewer {
            width: 100%; height: 60vh;
            background-color: #000;
            --poster-color: transparent;
            display: none;
        }

        .status-log { font-family: monospace; color: var(--primary); font-size: 0.8rem; margin-top: 15px; min-height: 20px; }
        .back-btn { position: fixed; bottom: 30px; color: #555; background: none; border: none; cursor: pointer; text-decoration: underline; z-index: 2000; }
    </style>
</head>
<body>

    <header><b>SICNOVA 3D</b> | IES SANTO REINO</header>

    <!-- 1. PANTALLA INICIAL -->
    <div id="screen-start" class="screen active">
        <h1 style="font-weight: 200;">Generador de <br><b style="color:var(--primary)">Gemelo Digital</b></h1>
        <p style="color:#555; margin-bottom: 40px;">Procesamiento de imagen 3D</p>
        <button class="btn btn-adult" onclick="showScreen('screen-capture')">Adulto (Escaneo 3D)</button>
        <button class="btn btn-minor" onclick="startMinorFlow()">Menor de Edad</button>
    </div>

    <!-- 2. CAPTURA Y PROCESAMIENTO -->
    <div id="screen-capture" class="screen">
        <div class="preview-circle">
            <div id="scanner" class="laser-line"></div>
            <img id="photo-preview" src="">
            <div id="label-cam" style="margin-top:100px; color:#222;">LISTO PARA SELFIE</div>
        </div>
        
        <input type="file" id="camera-input" accept="image/*" capture="user" style="display:none" onchange="startNeuralProcess(this)">
        <button id="btn-snap" class="btn btn-adult" onclick="document.getElementById('camera-input').click()">Hacer Foto</button>
        
        <div id="log" class="status-log"></div>
        <button class="back-btn" onclick="location.reload()">Cancelar</button>
    </div>

    <!-- 3. RESULTADO (EL AVATAR 3D REALISTA) -->
    <div id="screen-result" class="screen">
        <h2 style="color:var(--primary); margin:0;">Gemelo Digital Generado</h2>
        <p style="color:#444; font-size: 0.8rem; margin-bottom: 10px;">Modelo 3D optimizado para Sicnova</p>
        
        <!-- Este componente visualiza un modelo 3D real de un busto humano -->
        <model-viewer 
            id="avatar-3d" 
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            auto-rotate 
            camera-controls 
            shadow-intensity="1" 
            exposure="0.5">
        </model-viewer>

        <p style="color:var(--primary); font-style: italic; margin: 15px 0;">"Digitalización completada con éxito."</p>
        <button class="btn btn-minor" onclick="location.reload()">Repetir Escaneo</button>
    </div>

    <!-- 4. PANTALLA MENOR -->
    <div id="screen-minor" class="screen">
        <video id="minor-video" controls playsinline style="width:100%; max-width:400px; border-radius:20px;">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-btn" onclick="location.reload()">Volver al Inicio</button>
    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startMinorFlow() {
            showScreen('screen-minor');
            document.getElementById('minor-video').play();
        }

        function startNeuralProcess(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('label-cam').style.display = 'none';
                    const img = document.getElementById('photo-preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    
                    document.getElementById('scanner').style.display = 'block';
                    document.getElementById('btn-snap').style.display = 'none';
                    const log = document.getElementById('log');

                    // Simulación de los pasos de IA de Sicnova
                    log.innerText = "> Mapeando nube de puntos faciales...";
                    setTimeout(() => log.innerText = "> Generando malla poligonal (STL)...", 1500);
                    setTimeout(() => log.innerText = "> Aplicando texturas neuronales...", 3000);
                    setTimeout(() => {
                        showScreen('screen-result');
                        document.getElementById('avatar-3d').style.display = 'block';
                    }, 4500);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
