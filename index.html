<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicnova AI | Santo Reino</title>
    <style>
        :root { --primary: #00f2ff; --bg: #000; --accent: #7000ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #fff; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; padding: 20px; text-align: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; z-index: 1000; backdrop-filter: blur(10px); }

        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        /* Botones Grok Style */
        .btn { display: block; width: 100%; max-width: 300px; padding: 22px; margin: 12px 0; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-adult { background: linear-gradient(90deg, var(--primary), var(--accent)); color: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .btn-minor { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        /* Contenedor de Proceso */
        .preview-circle { width: 260px; height: 260px; border: 2px solid #333; border-radius: 50%; position: relative; overflow: hidden; background: #080808; margin-bottom: 30px; }
        #user-photo { width: 100%; height: 100%; object-fit: cover; display: none; }
        .scanner { position: absolute; width: 100%; height: 4px; background: var(--primary); top: 0; display: none; animation: scan 2s infinite linear; box-shadow: 0 0 15px var(--primary); }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        /* MOTOR DE AVATAR (Capa superior) */
        #avatar-engine-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; }
        iframe { width: 100%; height: 100%; border: none; }

        video { width: 100%; max-width: 500px; border-radius: 20px; }
        .status-msg { color: var(--primary); font-family: monospace; font-size: 0.8rem; margin-top: 15px; height: 20px; }
        .back-btn { position: fixed; bottom: 30px; color: #444; background: none; border: none; cursor: pointer; text-decoration: underline; z-index: 6000; }
    </style>
</head>
<body>

    <header><b>SICNOVA AI</b> | IES SANTO REINO</header>

    <!-- 1. SELECCIÓN -->
    <div id="screen-selector" class="screen active">
        <h1 style="font-weight: 200;">Generador <b>Avatar IA</b></h1>
        <p style="color: #666; margin-bottom: 40px;">Procesamiento Digital de Rostro</p>
        <button class="btn btn-adult" onclick="openCameraFlow()">Soy Adulto</button>
        <button class="btn btn-minor" onclick="openMinorFlow()">Soy Menor</button>
    </div>

    <!-- 2. CAPTURA Y ESCANEO (ADULTO) -->
    <div id="screen-capture" class="screen">
        <div class="preview-circle">
            <div id="scanner" class="scanner"></div>
            <img id="user-photo" src="">
            <div id="placeholder" style="margin-top:100px; color:#222;">LISTO PARA SELFIE</div>
        </div>
        
        <input type="file" id="camera-input" accept="image/*" capture="user" style="display:none" onchange="processAvatar(this)">
        <button id="btn-snap" class="btn btn-adult" onclick="document.getElementById('camera-input').click()">Hacer Foto</button>
        
        <div id="status" class="status-msg"></div>
        <button class="back-btn" onclick="location.reload()">Cancelar</button>
    </div>

    <!-- 3. MOTOR DE AVATAR INTEGRADO -->
    <div id="avatar-engine-overlay">
        <!-- Usamos el enlace más estable del mundo para avatares (Ready Player Me Global) -->
        <iframe id="avatar-frame" allow="camera; microphone; clipboard-write; autoplay"></iframe>
        <button class="back-btn" onclick="location.reload()" style="color: #fff; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px;">CERRAR Y VOLVER</button>
    </div>

    <!-- 4. FLUJO MENOR -->
    <div id="screen-minor" class="screen">
        <video id="minor-video" controls playsinline>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button class="back-btn" onclick="location.reload()">VOLVER</button>
    </div>

    <script>
        function openCameraFlow() {
            document.getElementById('screen-selector').style.display = 'none';
            document.getElementById('screen-capture').classList.add('active');
        }

        function openMinorFlow() {
            document.getElementById('screen-selector').style.display = 'none';
            document.getElementById('screen-minor').classList.add('active');
            document.getElementById('minor-video').play();
        }

        function processAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // 1. Mostrar la foto del usuario en el círculo
                    document.getElementById('placeholder').style.display = 'none';
                    const img = document.getElementById('user-photo');
                    img.src = e.target.result;
                    img.style.display = 'block';

                    // 2. Animación de Escaneo Grok
                    document.getElementById('scanner').style.display = 'block';
                    document.getElementById('btn-snap').style.display = 'none';
                    const status = document.getElementById('status');

                    // 3. Simular procesamiento de IA de Sicnova
                    status.innerText = "MAPEO FACIAL NEURONAL...";
                    setTimeout(() => status.innerText = "GENERANDO MALLA 3D...", 1500);
                    setTimeout(() => status.innerText = "SINCRO CON MOTOR IA...", 3000);

                    // 4. PASO CRÍTICO: Cargar el motor después de la interacción
                    setTimeout(() => {
                        const overlay = document.getElementById('avatar-engine-overlay');
                        const frame = document.getElementById('avatar-frame');
                        
                        // Usamos la URL que NO depende de subdominios y es compatible con móviles
                        frame.src = "https://readyplayer.me/es/avatar?theme=dark";
                        
                        overlay.style.display = 'block';
                    }, 4500);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
