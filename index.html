<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sicnova 3D - IES Santo Reino</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --primary: #007bff;
            --text: #ffffff;
            --gray: #888888;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Contenedor Principal */
        .app-wrapper {
            display: flex; flex-direction: column;
            width: 100%; height: 100%;
            align-items: center; justify-content: center;
        }

        header {
            width: 100%; padding: 20px; text-align: center;
            border-bottom: 1px solid #222; position: absolute; top: 0;
        }

        .screen {
            display: none; width: 90%; max-width: 450px;
            text-align: center; animation: fadeIn 0.5s ease;
        }

        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { font-size: 1.6rem; margin-bottom: 5px; }
        .subtitle { color: var(--gray); margin-bottom: 30px; font-size: 0.9rem; }

        /* Botones Estilo Sicnova */
        .btn {
            display: block; width: 100%; padding: 18px; margin: 15px 0;
            border: none; border-radius: 12px; font-size: 1rem;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .btn-adult { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3); }
        .btn-minor { background: #222; color: #fff; border: 1px solid #444; }
        .btn-back { background: none; color: var(--gray); text-decoration: underline; margin-top: 20px; }

        /* Frame del Avatar y Video */
        iframe, video {
            width: 100%; height: 75vh; border: none;
            border-radius: 15px; background: #000; margin-top: 60px;
        }

        #loading-msg { margin-top: 100px; color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <b style="color:var(--primary)">SICNOVA</b> | IES SANTO REINO
    </header>

    <div class="app-wrapper">

        <!-- PANTALLA 1: SELECCIÓN -->
        <div id="screen-start" class="screen active">
            <h1>Generador de Avatar</h1>
            <p class="subtitle">Digitalización 3D realista</p>
            
            <button class="btn btn-adult" onclick="startAdult()">Soy Adulto (+18)</button>
            <button class="btn btn-minor" onclick="startMinor()">Soy Menor de Edad</button>
        </div>

        <!-- PANTALLA 2: MENOR (VIDEO) -->
        <div id="screen-video" class="screen" style="max-width: 100%;">
            <video id="vid" controls>
                <!-- REEMPLAZA ESTA URL POR TU VIDEO CUANDO LO TENGAS -->
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
            <button class="btn btn-back" onclick="location.reload()">Volver</button>
        </div>

        <!-- PANTALLA 3: ADULTO (MOTOR IA) -->
        <div id="screen-avatar" class="screen" style="max-width: 100%;">
            <div id="loading-msg">Iniciando motor de cámara e IA...</div>
            <iframe id="avatar-frame" allow="camera *; microphone *; clipboard-write"></iframe>
            <button class="btn btn-back" onclick="location.reload()">Cerrar sesión</button>
        </div>

    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startAdult() {
            showScreen('screen-avatar');
            const frame = document.getElementById('avatar-frame');
            // Usamos la URL oficial de Ready Player Me con tema oscuro
            frame.src = "https://readyplayer.me/es/avatar?frameApi&theme=dark";

            frame.onload = () => {
                document.getElementById('loading-msg').style.display = 'none';
            };
        }

        function startMinor() {
            showScreen('screen-video');
            document.getElementById('vid').play();
        }

        // Captura el avatar cuando el usuario termina (opcional para desarrolladores)
        window.addEventListener('message', (event) => {
            const url = event.data;
            if (typeof url === 'string' && url.includes('http')) {
                console.log("Avatar finalizado. URL del modelo:", url);
            }
        });
    </script>
</body>
</html>
